{% extends 'admin_web/base.html' %}

{% block content %}
  <div class="container">
    <h1>Respond to Support Ticket</h1>

    <div class="ticket-details">
      <h3>Message from: {{ ticket.name }}</h3>
      <p><strong>Email:</strong> {{ ticket.email }}</p>
      <p><strong>Message:</strong> {{ ticket.message }}</p>
      <p><strong>Created At:</strong> {{ ticket.created_at }}</p>

      <!-- Response Form -->
      <!-- In respond.html -->
      <form method="POST" action="{% url 'respond_to_ticket' ticket.id %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="response">Your Response:</label>
            <textarea name="response" id="response" rows="6" class="form-control" placeholder="Write your response here..." required></textarea>
        </div>
        
        <button type="submit" class="btn btn-success mt-3">Submit Response</button>
    </form>

    </div>
    
    <div class="back-link mt-4">
      <a href="{% url 'support_list' %}" class="btn btn-secondary">Back to Support List</a>
    </div>
  </div>
{% endblock %}
