{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'admin_web/css/stylelog.css' %}">
</head>
<body>
    <div class="box">
        <div class="border-line"></div>
        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <h2>Sign in</h2>
            <div class="input-box">
                <input type="text" name="email" required="required">
                <span>Email</span>
                <i></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" required="required">
                <span>Password</span>
                <i></i>
            </div>
            <div class="imp-links">
            </div>
            <input type="submit" value="Login" class="btn">
        </form>
    </div>
    <div class="copy">
        <h6>Copyright owned by Helix</h6>
    </div>
</body>
</html>
