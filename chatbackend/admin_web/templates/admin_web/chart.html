{% extends 'admin_web/base.html' %}

{% block content %}
            <div class="container mt-4">
                <!-- Messages Per Month and Users Per Country Section (Side by side) -->
                <div class="row">
                    <!-- Messages Per Month -->
                    <div class="col-md-6">
                        <h4>Messages Per Month</h4>
                        <div class="card">
                            <div class="content">
                                <div class="head">
                                    <h5 class="mb-0">Messages Per Month</h5>
                                </div>
                                <div class="canvas-wrapper">
                                    <canvas id="messagesPerMonthChart" width="400" height="200"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
            
                    <!-- Users Per Country -->
                    <div class="col-md-6">
                        <h4 class="mt-5 mt-md-0">Users Per Country</h4>
                        <div class="card">
                            <div class="content">
                                <div class="head">
                                    <h5 class="mb-0">Users Per Country</h5>
                                </div>
                                <div class="canvas-wrapper">
                                    <canvas id="usersPerCountryChart" width="400" height="200"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            
                <!-- System Resource Utilization Section (Side by side) -->
                <div class="container mt-4">
                    <h4>System Resource Utilization</h4>
                    <div class="row">
                        <!-- CPU Usage -->
                        <div class="col-md-4">
                            <div class="card">
                                <div class="content">
                                    <div class="head">
                                        <h5 class="mb-0">CPU Usage</h5>
                                    </div>
                                    <div class="canvas-wrapper">
                                        <canvas id="cpuChart" width="150" height="150"></canvas>
                                        <p class="chart-title">CPU Usage</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                
                        <!-- Memory Usage -->
                        <div class="col-md-4">
                            <div class="card">
                                <div class="content">
                                    <div class="head">
                                        <h5 class="mb-0">Memory Usage</h5>
                                    </div>
                                    <div class="canvas-wrapper">
                                        <canvas id="memoryChart" width="150" height="150"></canvas>
                                        <p class="chart-title">Memory Usage</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                
                        <!-- Disk Usage -->
                        <div class="col-md-4">
                            <div class="card">
                                <div class="content">
                                    <div class="head">
                                        <h5 class="mb-0">Disk Usage</h5>
                                    </div>
                                    <div class="canvas-wrapper">
                                        <canvas id="diskChart" width="150" height="150"></canvas>
                                        <p class="chart-title">Disk Usage</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // Extract the data passed from the Django context
                    const messagesPerMonthData = {{ messages_per_month_data|safe }};
                    
                    // Prepare the chart data
                    const messagesPerMonthLabels = messagesPerMonthData.map(item => item.month);
                    const messagesPerMonthDataValues = messagesPerMonthData.map(item => item.message_count);
                    
                    // Chart for Messages Per Month (Line Chart)
                    const messagesPerMonthCtx = document.getElementById('messagesPerMonthChart').getContext('2d');
                    const messagesPerMonthChart = new Chart(messagesPerMonthCtx, {
                        type: 'line',
                        data: {
                            labels: messagesPerMonthLabels,
                            datasets: [{
                                label: 'Messages',
                                data: messagesPerMonthDataValues,
                                borderColor: '#FF5733',
                                fill: false,
                                tension: 0.1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'top' }
                            }
                        }
                    });
                });
                </script>

            <!--Chart For User count-->
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // Extract data passed from the Django context
                    const usersPerCountryData = {{ users_per_country_data|safe }};
                    
                    // Prepare the chart data
                    const usersPerCountryLabels = usersPerCountryData.map(item => item.region);
                    const usersPerCountryCounts = usersPerCountryData.map(item => item.user_count);
                    
                    // Chart for Users Per Country (Bar Chart)
                    const usersPerCountryCtx = document.getElementById('usersPerCountryChart').getContext('2d');
                    const usersPerCountryChart = new Chart(usersPerCountryCtx, {
                        type: 'bar',
                        data: {
                            labels: usersPerCountryLabels,
                            datasets: [{
                                label: 'Users',
                                data: usersPerCountryCounts,
                                backgroundColor: '#33B5FF',
                                borderColor: '#007BFF',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: { position: 'top' }
                            }
                        }
                    });
                });
                </script>
                
            <!--Chart for System Util-->
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    // Function to fetch system resource data (you can modify this to make an API call to the backend)
                    function fetchSystemResourceData() {
                        // For now, let's assume the values are being rendered directly from the Django template
                        return {
                            cpu: {{ cpu_usage|floatformat:1 }},
                            memory: {{ memory_usage|floatformat:1 }},
                            disk: {{ disk_usage|floatformat:1 }}
                        };
                    }
            
                    // Function to create or update the usage chart
                    function createUsageChart(canvasId, usageValue, color) {
                        const canvas = document.getElementById(canvasId);
                        if (!canvas) {
                            console.error(`Canvas with ID '${canvasId}' not found.`);
                            return;
                        }
            
                        const ctx = canvas.getContext('2d');
                        new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: ['Used', 'Free'],
                                datasets: [{
                                    data: [usageValue, 100 - usageValue],
                                    backgroundColor: [color, '#e0e0e0'],
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                responsive: false,
                                plugins: {
                                    legend: {
                                        display: false
                                    }
                                },
                                cutout: '70%'
                            }
                        });
                    }
            
                    // Function to update the charts with the new data
                    function updateCharts() {
                        const { cpu, memory, disk } = fetchSystemResourceData();
            
                        // Clear and recreate the charts with new data
                        createUsageChart('cpuChart', cpu, 'rgba(255, 99, 132, 0.8)');
                        createUsageChart('memoryChart', memory, 'rgba(54, 162, 235, 0.8)');
                        createUsageChart('diskChart', disk, 'rgba(255, 206, 86, 0.8)');
                    }
            
                    // Initial chart rendering
                    updateCharts();
            
                    // Update charts every 5 seconds (5000 milliseconds)
                    setInterval(updateCharts, 5000);
                });
            </script>
            
            
            <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-info float-end me-1">
                <i class="fas fa-angle-left"></i> <span class="btn-header">Return to Dashboard</span>
            </a>
{% endblock %}
