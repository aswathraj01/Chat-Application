{% extends 'admin_web/base.html' %}

{% block content %}
<a href="{% url 'user_list' %}" class="btn btn-sm btn-outline-info float-end me-1"><i class="fas fa-angle-left"></i> <span class="btn-header">Return</span></a>
<div class="container">
    <h2>Edit User: {{ user.first_name }} {{ user.last_name }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" class="form-control" name="dob" value="{{ user.dob }}">
        </div>
        <div class="form-group">
            <label for="region">Region</label>
            <input type="text" class="form-control" name="region" value="{{ user.region }}">
        </div>
        <div class="form-group">
            <label for="is_admin">Is Admin</label>
            <input type="checkbox" name="is_admin" {% if user.is_admin %} checked {% endif %}>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
