{% extends 'admin_web/base.html' %}

{% block content %}
<div class="container">
    <h2>Are you sure you want to delete the user: {{ user.first_name }} {{ user.last_name }}?</h2>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
